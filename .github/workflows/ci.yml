name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings: an unused dependency is a dependency that can still
  # change the emitted WASM bytes, and therefore the contract key.
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action on purpose. rust-toolchain.toml is the single
      # source of truth, and rustup (pre-installed on the runner) honours it,
      # installing the pinned version plus its declared targets and components
      # on first invocation. Naming a version here as well would let the two
      # drift apart -- and the contract key depends on the exact rustc version.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # `--locked` everywhere. Without it a transitive patch release can enter
      # the build, change the WASM bytes, and rotate the contract key.
      - name: Verify Cargo.lock is committed and current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      # These two build steps MUST precede BOTH `Clippy` and `Test`, not follow
      # them. Two independent reasons, and only the second is obvious:
      #
      # `Clippy` runs build scripts, and `ui/build.rs` panics outright when the
      # compiled contract and delegate WASM are absent -- the UI bundle embeds
      # them, and a path that silently resolves to nothing is worse than a loud
      # failure. On a cold runner (a cache miss is guaranteed on any branch
      # that churns `Cargo.lock`) a `Clippy` placed above these steps fails
      # before anything has built them. This is the same class of bug as the
      # `Test` ordering below; adding the `ui` crate is what made `Clippy`
      # artifact-dependent too.
      #
      # And `Test`: several CLI integration tests
      # (`cli/tests/common/mod.rs::contract_wasm()`) read the
      # compiled contract WASM off disk and silently skip themselves — printing
      # "skipping" and returning `Ok` — when the file is missing. A skipped
      # test reports the same `ok` as a passing one, so if the WASM were built
      # after `Test` (as it used to be), CI would report success while never
      # actually running `scholars_mate_end_to_end` or
      # `a_double_sign_attempt_is_refused_by_the_delegate`. Building here
      # first, and running the reproducibility checks (which `cargo clean`)
      # only after `Test`, keeps the WASM present when the tests need it.
      #
      # ubuntu-latest is the reference platform: `--remap-path-prefix` removes
      # the machine-specific prefixes, but the path SEPARATOR style still
      # differs between Windows and Linux, so the bytes — and therefore the
      # contract key — are only comparable within one OS. Local Windows/macOS
      # builds are for development only.
      #
      # The script also fails if a build path leaked into the WASM, and
      # asserts the wasm32 target builds at all: wasmtime has no getrandom
      # backend on wasm32-unknown-unknown, so a graph containing it produces
      # wasm-bindgen placeholder imports that cannot be resolved. See
      # freenet/river#241.
      - name: Build contract WASM (canonical)
        run: ./scripts/build-contract.sh

      - name: Assert no getrandom in the contract graph
        run: |
          if cargo tree -p adjourn-contract --target wasm32-unknown-unknown -i getrandom 2>/dev/null | grep -q getrandom; then
            echo "getrandom reached the contract dependency graph; the WASM will not instantiate under wasmtime"
            exit 1
          fi
          if cargo tree -p adjourn-contract --target wasm32-unknown-unknown -i rand_core 2>/dev/null | grep -q rand_core; then
            echo "rand_core reached the contract dependency graph; ed25519-dalek's rand_core feature would pull getrandom in behind it"
            exit 1
          fi

      # Same reasoning as the contract build above: must precede `Clippy` so
      # `ui/build.rs` finds it, and `Test` so the CLI tests that need the
      # delegate WASM do not silently skip.
      - name: Build delegate WASM (canonical)
        run: ./scripts/build-delegate.sh

      - name: Assert no getrandom in the delegate graph
        run: |
          if cargo tree -p adjourn-delegate --target wasm32-unknown-unknown -i getrandom 2>/dev/null | grep -q getrandom; then
            echo "getrandom reached the delegate dependency graph; the WASM will not instantiate under wasmtime"
            exit 1
          fi
          if cargo tree -p adjourn-delegate --target wasm32-unknown-unknown -i rand_core 2>/dev/null | grep -q rand_core; then
            echo "rand_core reached the delegate dependency graph; ed25519-dalek's rand_core feature would pull getrandom in behind it"
            exit 1
          fi

      # Below the WASM builds on purpose: see the block comment above them.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # `adjourn-client` exists SOLELY to be reachable from a browser, so a
      # version of it that does not compile for the browser's target is not
      # doing its job. A native `--no-default-features` check cannot catch
      # that: `rand`/`getrandom` only hard-error on wasm32-unknown-unknown.
      # Without this step the defect returns with the next dependency.
      - name: Assert adjourn-client compiles for the browser
        run: cargo check -p adjourn-client --no-default-features --target wasm32-unknown-unknown --locked

      - name: Assert the UI compiles for the browser
        run: cargo check -p adjourn-ui --target wasm32-unknown-unknown --locked

      # `adjourn-ui` must not reach the contract or the delegate: they are
      # wasmtime modules the UI EMBEDS as bytes, not crates it links. This is
      # the command `ui/Cargo.toml` cites as proof, run for real. `-e normal`
      # is load-bearing because it prints ONLY the graph that ships, and is
      # therefore unaffected by dev-dependencies. The plain `cargo tree` would
      # be misleading here: a dev-dep on `adjourn-client` resolves with default
      # features, turns its `fake` feature back on, and prints both crates even
      # when the shipping graph is clean. Without this step, reverting the
      # path-dependency workaround -- which really does put both crates in the
      # `-e normal` graph -- would be undetectable by the documented procedure.
      - name: Assert the UI graph excludes the contract and the delegate
        run: |
          graph=$(cargo tree -p adjourn-ui --target wasm32-unknown-unknown -e normal --locked)
          for crate in adjourn-contract adjourn-delegate; do
            if echo "$graph" | grep -q "$crate"; then
              echo "$crate reached adjourn-ui's normal dependency graph; the UI embeds it as bytes and must not link it"
              exit 1
            fi
          done

      - name: Test
        run: cargo test --workspace --locked

      # A rebuild from clean must produce the same bytes, or the contract key is
      # not a property of the commit. Runs after `Test` on purpose: it deletes
      # the WASM `Test` depends on via `cargo clean`.
      - name: Assert the build is reproducible
        run: |
          WASM=target/wasm32-unknown-unknown/release/adjourn_contract.wasm
          FIRST=$(sha256sum "$WASM" | cut -d' ' -f1)
          cargo clean
          ./scripts/build-contract.sh > /dev/null
          SECOND=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "first:  $FIRST"
          echo "second: $SECOND"
          if [ "$FIRST" != "$SECOND" ]; then
            echo "contract WASM is not reproducible; the contract key would be unstable"
            exit 1
          fi

      # Self-contained on purpose: the contract's reproducibility step above runs
      # `cargo clean`, which deletes the delegate WASM built earlier in the job.
      # This step therefore builds its own first artifact rather than hashing one
      # a sibling step may have removed -- hashing a missing file yields an empty
      # FIRST, which can never equal SECOND and fails for the wrong reason.
      - name: Assert the delegate build is reproducible
        run: |
          WASM=target/wasm32-unknown-unknown/release/adjourn_delegate.wasm
          ./scripts/build-delegate.sh > /dev/null
          FIRST=$(sha256sum "$WASM" | cut -d' ' -f1)
          cargo clean
          ./scripts/build-delegate.sh > /dev/null
          SECOND=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "first:  $FIRST"
          echo "second: $SECOND"
          if [ "$FIRST" != "$SECOND" ]; then
            echo "delegate WASM is not reproducible; the delegate key would be unstable"
            exit 1
          fi

  # The point of keeping `common` free of Freenet dependencies: the algebra is
  # verifiable on its own, with no contract runtime in the picture.
  algebra-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Assert common has no Freenet dependency
        run: |
          if cargo tree -p adjourn-core --locked | grep -Ei 'freenet'; then
            echo "adjourn-core must stay free of Freenet dependencies"
            exit 1
          fi
      - run: cargo test -p adjourn-core --locked
