<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Deliberately EMPTY. dx APPENDS `[web.app] title` from Dioxus.toml
         into whatever <title> it finds, and does nothing when there is no
         <title> element at all. So text here would be prefixed to the
         configured title ("adjournadjourn"), and removing the element
         entirely yields no title. An empty element is the only combination
         that produces exactly the configured title. -->
    <title></title>
    <style>
      :root {
        --light: #ebecd0;
        --dark: #779556;
        --target: #b9ca43;
        --selected: #f6f669;
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #302e2b;
        color: #e8e6e3;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .app { max-width: 42rem; margin: 0 auto; }
      h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: .02em; }

      /* The one safety-critical element in the shell: every failure this
         actor can produce -- a refused request, a dead socket, a bad paste
         -- lands here, so it must never read as ordinary body text. */
      .error {
        margin: 1rem 0;
        padding: .75rem 1rem;
        border-radius: 4px;
        background: #4a1f1f;
        border: 1px solid #a33;
        color: #ffd9d9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .error button {
        flex: none;
        background: transparent;
        border: 1px solid #ffd9d9;
        color: #ffd9d9;
        border-radius: 4px;
        padding: .25rem .75rem;
        cursor: pointer;
      }
      /* Deliberately NOT `.error`'s alarm styling: skew means the transport
         and this watch are both healthy, but the opponent is still signing
         moves against a contract this game migrated away from. There is
         nothing here to retry -- the fix is out of band -- so this reads as
         informational, not as a failure. */
      .skew {
        margin: 1rem 0;
        padding: .75rem 1rem;
        border-radius: 4px;
        background: #4a3f1f;
        border: 1px solid #a88a33;
        color: #ffedbd;
      }
      .migrate {
        border: 1px solid #a88a33;
        color: #ffedbd;
        background: transparent;
        border-radius: 4px;
        padding: .25rem .75rem;
        cursor: pointer;
      }
      .busy { margin: 1rem 0; opacity: .65; font-size: .9rem; }
      .hint { margin-top: 1rem; opacity: .75; font-size: .9rem; }
      .screen { margin-top: 1rem; }

      /* Eight columns, square cells, capped so the board stays usable on a
         phone without a media query. */
      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        width: min(90vw, 34rem);
        aspect-ratio: 1;
        border-radius: 4px;
        overflow: hidden;
      }
      .sq {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
      }
      .sq.light { background: var(--light); }
      .sq.dark { background: var(--dark); }
      .sq.selected { background: var(--selected); }
      .sq.target { background: var(--target); }

      /* Not your turn, or the game is over: clicks are gated in game.rs, but
         the pointer cursor kept inviting one anyway. Purely cosmetic -- see
         fix-round-1 in the task report. */
      .board.inactive .sq { cursor: default; }

      .piece { font-size: min(9vw, 2.6rem); line-height: 1; }
      /* One glyph set for both sides; colour carries the distinction, so the
         two never differ in visual weight. */
      .piece.white { color: #fff; text-shadow: 0 0 2px #000, 0 1px 2px #0008; }
      .piece.black { color: #1a1a1a; text-shadow: 0 0 1px #fff6; }

      .game { display: grid; grid-template-columns: minmax(0, 1fr) 14rem; gap: 1.5rem; align-items: start; }
      .right { background: rgba(255,255,255,.04); border-radius: 6px; padding: .75rem 1rem; }
      .history { max-height: 30rem; overflow-y: auto; margin: 0; padding-left: 1.5rem; font-variant-numeric: tabular-nums; }
      .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
      .promo { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: .5rem; background: #000a; }
      .promo button { font-size: 1.1rem; padding: .5rem 1.5rem; }
      @media (max-width: 40rem) { .game { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
